<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@600;800;900&amp;family=Plus+Jakarta+Sans:wght@500;600;700;800&amp;family=JetBrains+Mono:wght@500;700&amp;display=swap');
      
      .title {
        font-family: 'Outfit', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-weight: 900;
        letter-spacing: -1.5px;
      }
      .subtitle {
        font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-weight: 500;
        letter-spacing: -0.2px;
      }
      .badge-text {
        font-family: 'JetBrains Mono', monospace;
        font-weight: 700;
        font-size: 11px;
        letter-spacing: 1.5px;
        text-transform: uppercase;
      }
      .pill-text {
        font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-weight: 700;
        font-size: 11.5px;
        letter-spacing: 0.5px;
      }
      .mono-code {
        font-family: 'JetBrains Mono', monospace;
        font-size: 12px;
      }
    </style>
    
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c14"/>
      <stop offset="50%" stop-color="#111a2e"/>
      <stop offset="100%" stop-color="#05070a"/>
    </linearGradient>
    <linearGradient id="title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <radialGradient id="glow-shield" cx="300" cy="170" r="260" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#080c14" stop-opacity="0"/>
    </radialGradient>
    
  </defs>
  
  
    <rect width="1200" height="340" fill="url(#bg)"/>
    <rect width="1200" height="340" fill="none" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.2"/>
    <circle cx="300" cy="170" r="260" fill="url(#glow-shield)"/>
    
    <!-- Security Shield & Compliance Lock -->
    <g transform="translate(180, 65)">
      <!-- Outer Shield -->
      <path d="M100 10 L170 40 L170 120 Q170 180 100 205 Q30 180 30 120 L30 40 Z" fill="#0f172a" stroke="#38bdf8" stroke-width="2.5"/>
      <!-- Inner Shield Core -->
      <path d="M100 25 L155 50 L155 115 Q155 165 100 188 Q45 165 45 115 L45 50 Z" fill="#1e293b" stroke="#818cf8" stroke-width="1.5" opacity="0.8"/>
      
      <!-- Keyhole / Checkmark -->
      <circle cx="100" cy="95" r="14" fill="#38bdf8"/>
      <polygon points="94,105 106,105 110,135 90,135" fill="#38bdf8"/>
      <circle cx="100" cy="95" r="6" fill="#0f172a"/>
    </g>
    
  
    <g transform="translate(480, 0)">
      <g transform="translate(0, 58)">
        <rect width="180" height="26" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
        <text x="90" y="17" text-anchor="middle" class="badge-text" fill="#7dd3fc">POLICY &amp; COMPLIANCE</text>
      </g>
      
      <text x="0" y="142" class="title" font-size="54" fill="url(#title-grad)">policy-registry</text>
      
      <text x="0" y="184" class="subtitle" font-size="20" fill="#e2e8f0">Central Compliance, Security &amp; Architectural Policy Hub</text>
      <text x="0" y="210" class="subtitle" font-size="14" fill="#94a3b8" opacity="0.8">Machine-readable safety rules, boundary constraints, and ecosystem compliance standards.</text>
      
      <g transform="translate(0, 246)">
        <g transform="translate(0, 0)">
          <rect width="145" height="32" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
          <text x="72" y="20" text-anchor="middle" class="pill-text" fill="#bae6fd">🛡️ Security Policies</text>
        </g>
        <g transform="translate(157, 0)">
          <rect width="145" height="32" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
          <text x="72" y="20" text-anchor="middle" class="pill-text" fill="#bae6fd">📋 Schema Registry</text>
        </g>
        <g transform="translate(314, 0)">
          <rect width="145" height="32" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
          <text x="72" y="20" text-anchor="middle" class="pill-text" fill="#bae6fd">⚙️ Automated Audits</text>
        </g>
      </g>
    </g>
    
</svg>