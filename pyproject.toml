[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "policy-registry"
version = "0.1.2"
description = "Local-first pointer registry for policies, rules and decisions"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "Lukas G"}]
dependencies = ["cryptography>=42"]
keywords = [
  "policy",
  "governance",
  "security",
  "local-first",
  "mcp",
  "rules",
  "registry",
  "ed25519",
  "delegation",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Information Technology",
  "Intended Audience :: System Administrators",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Operating System :: OS Independent",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
  "Topic :: Security",
  "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Homepage = "https://github.com/ellmos-ai/policy-registry"
Documentation = "https://github.com/ellmos-ai/policy-registry#readme"
Repository = "https://github.com/ellmos-ai/policy-registry.git"
Issues = "https://github.com/ellmos-ai/policy-registry/issues"
Changelog = "https://github.com/ellmos-ai/policy-registry/blob/main/CHANGELOG.md"
Security = "https://github.com/ellmos-ai/policy-registry/blob/main/SECURITY.md"
Umbrella = "https://github.com/open-bricks"

[project.optional-dependencies]
mcp = ["mcp>=1.28.1,<2"]
test = [
  "pytest>=8",
  "jsonschema>=4.23",
  "tomli>=2; python_version<'3.11'",
]

[project.scripts]
policy-registry = "policy_registry.cli:main"
policy-registry-mcp = "policy_registry.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501", "E402", "E722", "E741", "F841"]
