[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "policy-registry"
version = "0.1.0"
description = "Local-first pointer registry for policies, rules and decisions"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Lukas G"}]
dependencies = []
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]

[project.optional-dependencies]
mcp = ["mcp>=1.2"]
test = ["pytest>=8"]

[project.scripts]
policy-registry = "policy_registry.cli:main"
policy-registry-mcp = "policy_registry.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]
